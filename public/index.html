<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Insight Vault</title>
<style>
  :root { --bg:#f7f7f5; --panel:#fff; --ink:#1d1d1b; --muted:#6b6b66; --line:#e3e3de; --accent:#4f46e5; --hl:#fde68a; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#161615; --panel:#1f1f1d; --ink:#ecece8; --muted:#9a9a93; --line:#33332f; --accent:#818cf8; --hl:#5c4a0d; }
  }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.5 system-ui,sans-serif; background:var(--bg); color:var(--ink); }
  header { display:flex; align-items:center; gap:16px; padding:12px 20px; border-bottom:1px solid var(--line); background:var(--panel); flex-wrap:wrap; }
  header h1 { font-size:17px; margin:0; }
  nav { display:flex; gap:4px; }
  button, input, textarea, select { font:inherit; color:inherit; }
  button { background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:6px 12px; cursor:pointer; }
  button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  button.tab.active { border-color:var(--accent); color:var(--accent); }
  button.danger { color:#dc2626; }
  input, textarea { background:var(--bg); border:1px solid var(--line); border-radius:6px; padding:6px 10px; width:100%; }
  main { display:grid; grid-template-columns:260px 1fr 280px; gap:16px; padding:16px 20px; max-width:1400px; margin:auto; }
  @media (max-width:900px) { main { grid-template-columns:1fr; } }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px; }
  .card h2 { font-size:14px; margin:0 0 10px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; }
  .item { padding:8px; border-radius:6px; cursor:pointer; display:flex; justify-content:space-between; gap:8px; }
  .item:hover, .item.active { background:var(--bg); }
  .muted { color:var(--muted); font-size:13px; }
  .text { white-space:pre-wrap; line-height:1.7; }
  mark.hl { background:var(--hl); color:inherit; border-radius:3px; cursor:pointer; padding:0 1px; }
  .tag { display:inline-block; background:var(--bg); border:1px solid var(--line); border-radius:99px; padding:0 8px; font-size:12px; margin:2px 4px 2px 0; cursor:pointer; }
  .tag.on { background:var(--accent); color:#fff; border-color:var(--accent); }
  .quote { border-left:3px solid var(--accent); padding:4px 10px; margin:8px 0; background:var(--bg); border-radius:0 6px 6px 0; }
  #popup { position:fixed; display:none; background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:8px; box-shadow:0 6px 24px #0003; z-index:10; width:260px; }
  .row { display:flex; gap:6px; margin-top:6px; }
  .stack > * + * { margin-top:10px; }
</style>
</head>
<body>
<header>
  <h1>Insight Vault</h1>
  <nav>
    <button class="tab active" data-tab="notes">Notes</button>
    <button class="tab" data-tab="insights">Insights</button>
    <button class="tab" data-tab="search">Search</button>
  </nav>
  <span class="muted" style="margin-left:auto">Local-first. No accounts, unlimited users, your data stays on this machine.</span>
  <a href="/api/export" download="insights.md"><button>Export insights (.md)</button></a>
</header>
<main id="app"></main>
<div id="popup">
  <div class="muted" id="popQuote"></div>
  <input id="popTags" placeholder="tags, comma separated (e.g. pricing, onboarding)">
  <div class="row"><button class="primary" id="popSave">Highlight</button><button id="popCancel">Cancel</button></div>
</div>

<script>
const $ = (s, el = document) => el.querySelector(s);
const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "class") el.className = v;
    else if (v !== false && v != null) el.setAttribute(k, v);
  }
  for (const kid of kids.flat()) if (kid != null) el.append(kid);
  return el;
};
const api = async (path, method = "GET", body) => {
  const r = await fetch("/api/" + path, { method, headers: { "Content-Type": "application/json" }, body: body ? JSON.stringify(body) : undefined });
  const data = await r.json();
  if (!r.ok) throw new Error(data.error || r.statusText);
  return data;
};

const S = { tab: "notes", state: { notes: [], highlights: [], insights: [] }, noteId: null, note: null, analysis: null, filterTags: new Set(), picked: new Set(), query: "", results: null, pending: null };

async function refresh() {
  S.state = await api("state");
  if (S.noteId) {
    try { S.note = await api("notes/" + S.noteId); S.analysis = await api(`notes/${S.noteId}/analysis`); }
    catch { S.noteId = S.note = S.analysis = null; }
  }
  render();
}

function render() {
  $("#popup").style.display = "none";
  document.querySelectorAll("button.tab").forEach((b) => b.classList.toggle("active", b.dataset.tab === S.tab));
  const app = $("#app");
  app.replaceChildren();
  if (S.tab === "notes") renderNotes(app);
  else if (S.tab === "insights") renderInsights(app);
  else renderSearch(app);
}

// ----- Notes tab -----
function renderNotes(app) {
  const list = h("div", { class: "card" }, h("h2", {}, "Research notes"),
    h("button", { class: "primary", style: "width:100%;margin-bottom:8px", onclick: () => { S.noteId = null; S.note = null; render(); } }, "+ Add note"),
    S.state.notes.length === 0 ? h("div", { class: "muted" }, "No notes yet.") : null,
    S.state.notes.map((n) => h("div", { class: "item" + (n.id === S.noteId ? " active" : ""), onclick: () => { S.noteId = n.id; refresh(); } },
      h("span", {}, n.title), h("span", { class: "muted" }, S.state.highlights.filter((x) => x.noteId === n.id).length + " ✦"))));
  app.append(list);

  if (!S.note) {
    const title = h("input", { placeholder: "Title (e.g. Interview with Priya, 12 Nov)" });
    const source = h("input", { placeholder: "Source (interview, survey, support ticket...)", value: "interview" });
    const text = h("textarea", { rows: 14, placeholder: "Paste a transcript or notes, or load a .txt/.md file below" });
    const file = h("input", { type: "file", accept: ".txt,.md,.vtt,.srt,.csv", onchange: async (e) => { const f = e.target.files[0]; if (f) { text.value = await f.text(); if (!title.value) title.value = f.name.replace(/\.[^.]+$/, ""); } } });
    app.append(h("div", { class: "card stack" }, h("h2", {}, "New note"), title, source, text, file,
      h("button", { class: "primary", onclick: async () => {
        try { const n = await api("notes", "POST", { title: title.value, source: source.value, text: text.value }); S.noteId = n.id; await refresh(); }
        catch (e) { alert(e.message); }
      } }, "Save note")), h("div"));
    return;
  }

  const viewer = h("div", { class: "card" },
    h("div", { style: "display:flex;justify-content:space-between;align-items:center" },
      h("div", {}, h("strong", {}, S.note.title), h("div", { class: "muted" }, S.note.source + " · select any text to highlight and tag it")),
      h("button", { class: "danger", onclick: async () => { if (confirm("Delete this note and its highlights?")) { await api("notes/" + S.noteId, "DELETE"); S.noteId = S.note = null; refresh(); } } }, "Delete")),
    h("hr", { style: "border:0;border-top:1px solid var(--line);margin:12px 0" }),
    renderText());
  app.append(viewer);

  const a = S.analysis;
  const hls = S.state.highlights.filter((x) => x.noteId === S.noteId);
  app.append(h("div", { class: "stack" },
    h("div", { class: "card" }, h("h2", {}, "Auto summary"),
      a.summary.length ? a.summary.map((s) => h("p", { style: "margin:0 0 8px" }, s)) : h("div", { class: "muted" }, "Not enough text to summarise."),
      h("div", {}, a.keywords.map((k) => h("span", { class: "tag" }, k))),
      h("div", { class: "muted" }, `Sentiment: ${a.sentiment} (+${a.positive} / -${a.negative})`)),
    h("div", { class: "card" }, h("h2", {}, `Highlights (${hls.length})`),
      hls.length === 0 ? h("div", { class: "muted" }, "None yet.") : null,
      hls.map((x) => h("div", { class: "quote" }, x.text.slice(0, 140) + (x.text.length > 140 ? "…" : ""),
        h("div", {}, x.tags.map((t) => h("span", { class: "tag" }, t)),
          h("button", { class: "danger", style: "padding:0 6px;font-size:12px", onclick: async () => { await api("highlights/" + x.id, "DELETE"); refresh(); } }, "remove")))))));
}

function renderText() {
  const text = S.note.text;
  const hls = S.state.highlights.filter((x) => x.noteId === S.noteId).sort((a, b) => a.start - b.start);
  const box = h("div", { class: "text", id: "textbox" });
  let pos = 0;
  const plain = (a, b) => { if (b > a) box.append(h("span", { "data-off": a }, text.slice(a, b))); };
  for (const x of hls) {
    if (x.start < pos) continue; // skip overlaps
    plain(pos, x.start);
    box.append(h("mark", { class: "hl", title: x.tags.join(", ") || "highlight" }, h("span", { "data-off": x.start }, text.slice(x.start, x.end))));
    pos = x.end;
  }
  plain(pos, text.length);
  box.addEventListener("mouseup", onSelect);
  return box;
}

function offsetOf(node, offset) {
  let el = node.nodeType === 3 ? node.parentElement : node;
  while (el && el.dataset && el.dataset.off === undefined) el = el.parentElement;
  return el && el.dataset ? Number(el.dataset.off) + offset : null;
}
function onSelect() {
  const sel = getSelection();
  if (!sel.rangeCount || sel.isCollapsed) return;
  const r = sel.getRangeAt(0);
  let start = offsetOf(r.startContainer, r.startOffset), end = offsetOf(r.endContainer, r.endOffset);
  if (start == null || end == null) return;
  if (end < start) [start, end] = [end, start];
  // snap to trimmed range
  const raw = S.note.text.slice(start, end);
  start += raw.length - raw.trimStart().length; end -= raw.length - raw.trimEnd().length;
  if (end <= start) return;
  S.pending = { start, end };
  const rect = r.getBoundingClientRect();
  const pop = $("#popup");
  $("#popQuote").textContent = S.note.text.slice(start, end).slice(0, 80);
  $("#popTags").value = "";
  pop.style.display = "block";
  pop.style.left = Math.min(rect.left, innerWidth - 280) + "px";
  pop.style.top = Math.min(rect.bottom + 8, innerHeight - 140) + "px";
  $("#popTags").focus();
}
$("#popSave").onclick = async () => {
  try {
    await api("highlights", "POST", { noteId: S.noteId, ...S.pending, tags: $("#popTags").value.split(",") });
    getSelection().removeAllRanges(); refresh();
  } catch (e) { alert(e.message); }
};
$("#popCancel").onclick = () => { $("#popup").style.display = "none"; };
$("#popTags").addEventListener("keydown", (e) => { if (e.key === "Enter") $("#popSave").click(); });

// ----- Insights tab -----
function renderInsights(app) {
  const allTags = [...new Set(S.state.highlights.flatMap((x) => x.tags))].sort();
  const shown = S.state.highlights.filter((x) => S.filterTags.size === 0 || x.tags.some((t) => S.filterTags.has(t)));
  const noteName = (id) => (S.state.notes.find((n) => n.id === id) || {}).title || "?";

  const title = h("input", { placeholder: "Insight title (e.g. Onboarding confuses new users)" });
  const desc = h("textarea", { rows: 3, placeholder: "What does the evidence tell you?" });

  app.append(
    h("div", { class: "card" }, h("h2", {}, "Filter by tag"),
      allTags.length ? allTags.map((t) => h("span", { class: "tag" + (S.filterTags.has(t) ? " on" : ""), onclick: () => { S.filterTags.has(t) ? S.filterTags.delete(t) : S.filterTags.add(t); render(); } }, t)) : h("div", { class: "muted" }, "Tag some highlights first.")),
    h("div", { class: "card stack" }, h("h2", {}, `Evidence (${shown.length}), tick quotes to build an insight`),
      shown.length === 0 ? h("div", { class: "muted" }, "No highlights match.") : null,
      shown.map((x) => h("label", { class: "quote", style: "display:block;cursor:pointer" },
        h("input", { type: "checkbox", style: "width:auto;margin-right:8px", checked: S.picked.has(x.id) ? "" : false, onchange: (e) => { e.target.checked ? S.picked.add(x.id) : S.picked.delete(x.id); } }),
        x.text, h("div", { class: "muted" }, noteName(x.noteId) + " · " + x.tags.join(", ")))),
      title, desc,
      h("button", { class: "primary", onclick: async () => {
        try { await api("insights", "POST", { title: title.value, description: desc.value, highlightIds: [...S.picked] }); S.picked.clear(); refresh(); }
        catch (e) { alert(e.message); }
      } }, "Create insight from selected")),
    h("div", { class: "card stack" }, h("h2", {}, `Insights (${S.state.insights.length})`),
      S.state.insights.length === 0 ? h("div", { class: "muted" }, "No insights yet.") : null,
      S.state.insights.map((i) => h("div", {}, h("strong", {}, i.title), h("p", { style: "margin:4px 0" }, i.description),
        i.highlightIds.map((id) => { const x = S.state.highlights.find((y) => y.id === id); return x ? h("div", { class: "quote", onclick: () => { S.tab = "notes"; S.noteId = x.noteId; refresh(); }, style: "cursor:pointer" }, x.text, h("div", { class: "muted" }, "↗ " + noteName(x.noteId))) : null; }),
        h("button", { class: "danger", onclick: async () => { await api("insights/" + i.id, "DELETE"); refresh(); } }, "Delete insight")))));
  app.style.gridTemplateColumns = "1fr";
}

// ----- Search tab -----
function renderSearch(app) {
  const q = h("input", { placeholder: "Search notes, quotes and tags...", value: S.query });
  const out = h("div", { class: "stack" });
  const run = async () => {
    S.query = q.value;
    S.results = S.query ? await api("search?q=" + encodeURIComponent(S.query)) : [];
    out.replaceChildren(...(S.results.length ? S.results.map((r) => h("div", { class: "quote", style: "cursor:pointer", onclick: () => { S.tab = "notes"; S.noteId = r.noteId; refresh(); } }, h("strong", {}, r.type + ": " + r.title), h("div", {}, r.snippet))) : [h("div", { class: "muted" }, S.query ? "No results." : "")]));
  };
  q.addEventListener("input", run);
  app.append(h("div", { class: "card stack" }, h("h2", {}, "Search"), q, out));
  app.style.gridTemplateColumns = "1fr";
  if (S.query) run();
}

document.querySelectorAll("button.tab").forEach((b) => b.addEventListener("click", () => { S.tab = b.dataset.tab; $("#app").style.gridTemplateColumns = ""; render(); }));
refresh();
</script>
</body>
</html>
